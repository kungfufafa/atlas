<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Atlas</title>
    <link href="/atlas-logo-dither.png" rel="icon" type="image/png">
    <script>
    "use strict";
    (() => {
      var stored = localStorage.getItem("atlas-theme");
      var resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      if (stored === "light" || stored === "dark") {
        resolved = stored;
      } else if (stored === "system") {
        resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      document.documentElement.classList.toggle("dark", resolved === "dark");
      document.documentElement.style.colorScheme = resolved;
      var favicon = document.querySelector('link[rel="icon"]');
      if (favicon) {
        favicon.setAttribute(
          "href",
          resolved === "light"
            ? "/atlas-logo-dither-light.png"
            : "/atlas-logo-dither.png"
        );
      }
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </body>
</html>
