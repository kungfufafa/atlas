version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Expo SDK57 advertises ~2.32.0. Upgrade the native major only with
      # an explicit Expo compatibility migration and device validation.
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/docs/website"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
