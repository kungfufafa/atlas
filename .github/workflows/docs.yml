name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs/website

      - name: Build docs
        run: bun run build
        working-directory: docs/website
        env:
          NODE_ENV: production
          ATLAS_DOCS_GITHUB_PAGES: 'true'

      - name: Verify GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is configured for ${GITHUB_REPOSITORY}."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Docs built; deploy skipped."
          echo ""
          echo "One-time setup (repository admin):"
          echo "  1. Open https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "  2. Under Build and deployment, set Source to GitHub Actions"
          echo "  3. Re-run this workflow (Actions → Docs → Run workflow)"
          echo ""
          echo "Workflows cannot enable Pages automatically — GitHub does not allow"
          echo "GITHUB_TOKEN to create a Pages site (security policy)."
          echo ""
          echo "Private repositories require a paid GitHub plan to publish Pages."
          echo "Free accounts need a public repository or a separate public docs repo."

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/website/out

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Retry Pages deploy
        if: steps.pages.outputs.enabled == 'true' && steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify Pages deploy
        if: steps.pages.outputs.enabled == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
