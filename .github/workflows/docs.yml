name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs/website

      - name: Build docs
        run: bun run build
        working-directory: docs/website
        env:
          NODE_ENV: production
          ATLAS_DOCS_GITHUB_PAGES: 'true'

      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is configured for ${GITHUB_REPOSITORY}."
            exit 0
          fi

          echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}."
          echo ""
          echo "One-time setup (repository admin):"
          echo "  1. Open https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "  2. Under Build and deployment, set Source to GitHub Actions"
          echo "  3. Re-run this workflow (Actions → Docs → Run workflow)"
          echo ""
          echo "Workflows cannot enable Pages automatically — GitHub does not allow"
          echo "GITHUB_TOKEN to create a Pages site (security policy)."
          echo ""
          echo "Private repositories require a paid GitHub plan to publish Pages."
          echo "Free accounts need a public repository or a separate public docs repo."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry Pages deploy
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5

      - name: Verify Pages deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
