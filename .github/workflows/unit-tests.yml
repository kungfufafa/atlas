name: Unit Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LLM_VCR_MODE: replay

jobs:
  docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install docs dependencies
        working-directory: docs/website
        run: bun install --frozen-lockfile

      - name: Type-check generated docs routes and MDX
        working-directory: docs/website
        run: bun run typecheck

      - name: Build and type-check docs static export
        working-directory: docs/website
        env:
          ATLAS_DOCS_GITHUB_PAGES: "true"
        run: bun run build

      - name: Verify exported docs and search index
        working-directory: docs/website
        run: bun run verify:export

  mobile:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Type-check mobile with its SDK compiler
        working-directory: apps/mobile
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Export iOS and Android bundles
        working-directory: apps/mobile
        env:
          CI: "1"
        run: node node_modules/expo/bin/cli export --platform ios --platform android --output-dir /tmp/atlas-mobile-export

  docker-files:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image and exercise its file runtime and isolation
        run: bash scripts/verify-docker-files.sh

  static:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type-check server-side code
        run: bun run typecheck

      - name: Type-check web
        run: bun run typecheck:web

      - name: Type-check file and live verification scripts
        run: bunx tsc --noEmit -p scripts/file-runtime/tsconfig.json

  unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install native media and Office test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation libreoffice-calc libreoffice-impress libreoffice-writer

      - name: Run unit tests
        run: bun run test

  smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Channel file-in/file-out loop
        run: bun run test:smoke

  heavy:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install LibreOffice (office preview fidelity tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            libreoffice-calc \
            libreoffice-impress \
            libreoffice-writer

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium (browser session tests)
        run: bunx playwright install --with-deps chromium

      - name: Run browser and office fidelity tests
        run: bun run test:heavy

      - name: Verify PDF viewer interactions and recovery
        run: node apps/web/scripts/verify-pdf-viewer.ts
