name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check server-side code
        run: bun run typecheck

      - name: Build workspaces
        run: bun run build

      - name: Install LibreOffice (office preview fidelity tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            libreoffice-calc \
            libreoffice-impress \
            libreoffice-writer

      - name: Install Playwright Chromium (browser session tests)
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      - name: Channel file-in/file-out loop
        run: bun test scripts/channel-loop-harness/channel-loop-harness.test.ts

      - name: Critical-path residual checks
        run: bun test scripts/e2e-critical-paths.test.ts
